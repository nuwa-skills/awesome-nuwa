name: Update star history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install image renderer
        run: npm ci

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run update-star-history

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/star-history.png; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.png
          git commit -m "docs: update star history chart"
          git push
